name: source checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Publication privacy audit
        run: ./scripts/verify_publication.sh
      - name: Python unit tests
        run: python -W error -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Builder and projection tests
        run: python -m unittest discover -s tests/data -p 'test_*.py' -v

  macos-launcher-source:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher scripts and property list
        run: |
          bash -n desktop_app/build_macos_app.sh desktop_app/install_macos_app.sh
          plutil -lint desktop_app/Info.plist
      - name: Compile and ad-hoc sign the native launcher
        run: |
          xcrun swiftc -O -target "$(uname -m)-apple-macosx12.0" \
            -module-cache-path "$RUNNER_TEMP/swift-module-cache" \
            -framework AppKit desktop_app/SpliceImpactRBrowserLauncher.swift \
            -o "$RUNNER_TEMP/SpliceImpactRBrowserLauncher"
          codesign --force --sign - "$RUNNER_TEMP/SpliceImpactRBrowserLauncher"
          codesign --verify --strict "$RUNNER_TEMP/SpliceImpactRBrowserLauncher"
    # This checks native source/toolchain compatibility, not a full scientific
    # installation. The latter remains a separate local generated-data gate.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: frontend
        run: pnpm test
      - name: TypeScript checks
        working-directory: frontend
        run: pnpm run typecheck
      - name: Production build
        working-directory: frontend
        run: pnpm run build

  r-annotation-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Bioconductor dependencies may build from source even when CRAN
      # binaries are enabled. R alone does not provide these development files.
      - name: Install Linux R build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gfortran cmake pkg-config \
            libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev \
            zlib1g-dev libbz2-dev liblzma-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true
      - name: Install released Bioconductor dependencies
        run: ./scripts/install_spliceimpactr.sh
      - name: Complete-annotation and public-package integration test
        run: Rscript --vanilla tests/r/test_browser_annotation.R
      - name: Human PPI context exporter contract tests
        run: Rscript --vanilla tests/r/test_ppi_context_export.R
      - name: R exporter preflight tests
        run: python3 -m unittest tests.data.test_r_preflight -v
